[metadata]
name = openfga-cli-py
version = 0.8.2.0
description = Python wrapper around invoking the OpenFGA CLI (https://github.com/openfga/cli)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/neeve-ai/openfga-cli-py
author = oss-robin
license = Apache License Version 2.0
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
python_requires = >=3.11
setup_requires =
    setuptools-download

[setuptools_download]
download_scripts =
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/openfga/cli/releases/download/v0.8.2/fga_0.8.2_linux_amd64.tar.gz
    sha256 = e48c4a73cf68031fe9fc0827f1462a9b2d6981e3d2e9b82f1e1c2e120c293443
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "aarch64"
    url = https://github.com/openfga/cli/releases/download/v0.8.2/fga_0.8.2_linux_arm64.tar.gz
    sha256 = 53466aa8fa3bcdf00aa118aabb90c81aedc178501169f53df167aac4e4638e3a
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "i686"
    url = https://github.com/openfga/cli/releases/download/v0.8.2/fga_0.8.2_linux_386.tar.gz
    sha256 = c0dbfec84aa79264acdd1bf004a7e63457b947950a38df12a366d03c09cd9201
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "darwin" and platform_machine == "x86_64"
    url = https://github.com/openfga/cli/releases/download/v0.8.2/fga_0.8.2_darwin_amd64.tar.gz
    sha256 = 44bdb85e0c1ee058a26da041d865b6caf814801b57633a70fd43cd8c85698927
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "darwin" and platform_machine == "arm64"
    url = https://github.com/openfga/cli/releases/download/v0.8.2/fga_0.8.2_darwin_arm64.tar.gz
    sha256 = a1a31e07d525a3472d8d872d93c7116cf22af24e42a4ba11cc5927ae5b3000e1
    extract = tar
    extract_path = fga
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "AMD64"
    url = https://github.com/openfga/cli/releases/download/v0.8.2/fga_0.8.2_windows_amd64.tar.gz
    sha256 = fa1d8722a1eb0af8cdc9ee3f6bdd0f8f1ee8676e1b4f10fae2a4c84f14e4c9e8
    extract = tar
    extract_path = fga.exe
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "ARM64"
    url = https://github.com/openfga/cli/releases/download/v0.8.2/fga_0.8.2_windows_arm64.tar.gz
    sha256 = 2627989bde4e8156eddc596a116bf03b1755ce3a774df35e2a7b27b69a119c52
    extract = tar
    extract_path = fga.exe
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "x86"
    url = https://github.com/openfga/cli/releases/download/v0.8.2/fga_0.8.2_windows_386.tar.gz
    sha256 = 83ee944d649792f8050bc903bc10a17824690dea1dfa7468b69c0a0461fb8789
    extract = tar
    extract_path = fga.exe
