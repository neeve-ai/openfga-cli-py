[metadata]
name = openfga-cli-py
version = 0.9.0.0
description = Python wrapper around invoking the OpenFGA CLI (https://github.com/openfga/cli)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/neeve-ai/openfga-cli-py
author = oss-robin
license = Apache License Version 2.0
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
python_requires = >=3.11
setup_requires =
    setuptools-download

[setuptools_download]
download_scripts =
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/openfga/cli/releases/download/v0.9.0/fga_0.9.0_linux_amd64.tar.gz
    sha256 = c09b7e843d7015200b91d6a072c2667d04baa8b1792720700ab7c3f99e23a1e9
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "aarch64"
    url = https://github.com/openfga/cli/releases/download/v0.9.0/fga_0.9.0_linux_arm64.tar.gz
    sha256 = 3f46537538e708ed416e797ec8fe902f3fc940b5279eb1b94dbb0200dca967e5
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "i686"
    url = https://github.com/openfga/cli/releases/download/v0.9.0/fga_0.9.0_linux_386.tar.gz
    sha256 = a3a7f1b533c0eda2ea7131159f413daa47ba8d8b7b3ff41b78c220f04eeda61f
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "darwin" and platform_machine == "x86_64"
    url = https://github.com/openfga/cli/releases/download/v0.9.0/fga_0.9.0_darwin_amd64.tar.gz
    sha256 = 38318f0476015e3e868afa084272bb05ebb62331c42fca619e9c6db1ffcf5771
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "darwin" and platform_machine == "arm64"
    url = https://github.com/openfga/cli/releases/download/v0.9.0/fga_0.9.0_darwin_arm64.tar.gz
    sha256 = 92e071a5c31103720fa6ace89faa54b3be3958905616558457966c210d238f9f
    extract = tar
    extract_path = fga
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "AMD64"
    url = https://github.com/openfga/cli/releases/download/v0.9.0/fga_0.9.0_windows_amd64.tar.gz
    sha256 = 730a6e3aa1999fbd1d58aa5a59bfa9332285c6c597231c6cd8963c4c45f9be2c
    extract = tar
    extract_path = fga.exe
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "ARM64"
    url = https://github.com/openfga/cli/releases/download/v0.9.0/fga_0.9.0_windows_arm64.tar.gz
    sha256 = d28d8ee3cc1dd97134833509db28a270131f9fbc3c455f65f951a2860daf589a
    extract = tar
    extract_path = fga.exe
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "x86"
    url = https://github.com/openfga/cli/releases/download/v0.9.0/fga_0.9.0_windows_386.tar.gz
    sha256 = 1e0bb7a4e14cbb696bd52ad9e6b00945b8ee1fd60456c3f16395cd035669c471
    extract = tar
    extract_path = fga.exe
