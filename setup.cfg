[metadata]
name = openfga-cli-py
version = 0.8.1.0
description = Python wrapper around invoking the OpenFGA CLI (https://github.com/openfga/cli)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/neeve-ai/openfga-cli-py
author = oss-robin
license = Apache License Version 2.0
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
python_requires = >=3.11
setup_requires =
    setuptools-download

[setuptools_download]
download_scripts =
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/openfga/cli/releases/download/v0.8.1/fga_0.8.1_linux_amd64.tar.gz
    sha256 = e0414ad70850f8070540ad1be7a1e2e861edd6d6e73f6ed2b959c3277f98a54c
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "aarch64"
    url = https://github.com/openfga/cli/releases/download/v0.8.1/fga_0.8.1_linux_arm64.tar.gz
    sha256 = 6c530a0e50449b611b98f9cf66d6e33cf6533535c7f4b1055fdf0cd299d089d0
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "i686"
    url = https://github.com/openfga/cli/releases/download/v0.8.1/fga_0.8.1_linux_386.tar.gz
    sha256 = ab0933b27bcd5d01d23dc15f71b51b05437a43e7a5acde1a55e3632df900f35b
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "darwin" and platform_machine == "x86_64"
    url = https://github.com/openfga/cli/releases/download/v0.8.1/fga_0.8.1_darwin_amd64.tar.gz
    sha256 = be25a6de94d1b57289ecd66e496e97a2c6f5376adfca993bdd1e5a43231197f3
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "darwin" and platform_machine == "arm64"
    url = https://github.com/openfga/cli/releases/download/v0.8.1/fga_0.8.1_darwin_arm64.tar.gz
    sha256 = 74de011e906ca0a03058be82664069793d15dc41abe0f0780dfba5df340c947e
    extract = tar
    extract_path = fga
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "AMD64"
    url = https://github.com/openfga/cli/releases/download/v0.8.1/fga_0.8.1_windows_amd64.tar.gz
    sha256 = a639baed282bcf15af565e4262273580edf156be6029a162ffd1eab45da45dec
    extract = tar
    extract_path = fga.exe
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "ARM64"
    url = https://github.com/openfga/cli/releases/download/v0.8.1/fga_0.8.1_windows_arm64.tar.gz
    sha256 = ccbf23c9ef887efb5c10cbe1a5f56da743a5f16f9fd1f992af1a5682a9428677
    extract = tar
    extract_path = fga.exe
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "x86"
    url = https://github.com/openfga/cli/releases/download/v0.8.1/fga_0.8.1_windows_386.tar.gz
    sha256 = 0024a89d93170c56b980dd230ae612ce1bb3b725d7aff27bfa99495d967af25f
    extract = tar
    extract_path = fga.exe
