[metadata]
name = openfga-cli-py
version = 0.8.0.0
description = Python wrapper around invoking the OpenFGA CLI (https://github.com/openfga/cli)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/neeve-ai/openfga-cli-py
author = oss-robin
license = Apache License Version 2.0
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
python_requires = >=3.11
setup_requires =
    setuptools-download

[setuptools_download]
download_scripts =
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/openfga/cli/releases/download/v0.8.0/fga_0.8.0_linux_amd64.tar.gz
    sha256 = 9393d915a1c2eef92986a53824be112ff918e4fe844e33dc6b45b0d3a902275a
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "aarch64"
    url = https://github.com/openfga/cli/releases/download/v0.8.0/fga_0.8.0_linux_arm64.tar.gz
    sha256 = 3c2ed7a9735088dc13e220c66af60e7fe003187b0d7953b08a906dee9cc3f6ef
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "linux" and platform_machine == "i686"
    url = https://github.com/openfga/cli/releases/download/v0.8.0/fga_0.8.0_linux_386.tar.gz
    sha256 = 8f2ea8aab9c4dae9c082ccda7264c0fc8a8c63ea234a7bf92378f1a16849db2a
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "darwin" and platform_machine == "x86_64"
    url = https://github.com/openfga/cli/releases/download/v0.8.0/fga_0.8.0_darwin_amd64.tar.gz
    sha256 = 5d5ce83bd3b05c9b7c9b947b58ca9658ccdd00f27ad194b3289c401fd4c0b7ba
    extract = tar
    extract_path = fga
    [fga]
    group = fga-binary
    marker = sys_platform == "darwin" and platform_machine == "arm64"
    url = https://github.com/openfga/cli/releases/download/v0.8.0/fga_0.8.0_darwin_arm64.tar.gz
    sha256 = d0c1b9a4a9df7ddafc7fb2d059c5a4a53af4906b0eea706652669759295fe406
    extract = tar
    extract_path = fga
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "AMD64"
    url = https://github.com/openfga/cli/releases/download/v0.8.0/fga_0.8.0_windows_amd64.tar.gz
    sha256 = 59b72b053ddf32a000cd4e539f461339df460978a3180d68ac52088cdb4c33b2
    extract = tar
    extract_path = fga.exe
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "ARM64"
    url = https://github.com/openfga/cli/releases/download/v0.8.0/fga_0.8.0_windows_arm64.tar.gz
    sha256 = e0cff167c262da94f0d0e8bce31a90612731c5bb9fa9b14cb742c71e50ceda77
    extract = tar
    extract_path = fga.exe
    [fga.exe]
    group = fga-binary
    marker = sys_platform == "win32" and platform_machine == "x86"
    url = https://github.com/openfga/cli/releases/download/v0.8.0/fga_0.8.0_windows_386.tar.gz
    sha256 = 2e65022c84cb9bff94737f7069fb6509358ce3b6103eac1cd05d87f7c67015a4
    extract = tar
    extract_path = fga.exe
